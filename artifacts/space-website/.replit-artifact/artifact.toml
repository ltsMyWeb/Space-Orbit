kind = "web"
previewPath = "/"
title = "Space Explorer"
version = "1.0.0"
id = "artifacts/space-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18826

[services.development]
run = "pnpm --filter @workspace/space-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/space-website", "run", "build" ]
publicDir = "artifacts/space-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18826"
BASE_PATH = "/"
